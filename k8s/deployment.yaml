apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigenerator
  labels:
    app: apigenerator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigenerator
  template:
    metadata:
      labels:
        app: apigenerator
    spec:
      containers:
        - name: apigenerator
          image: apigenerator:latest
          imagePullPolicy: IfNotPresent
          args:
            - /config/config.yaml
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: apigenerator-db
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apigenerator-db
                  key: DB_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: apigenerator-config
            items:
              - key: config.yaml
                path: config.yaml
